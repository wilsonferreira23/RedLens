services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: redlens-juice-shop
    ports:
      - "13000:3000"
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat:latest
    container_name: redlens-webgoat
    ports:
      - "8081:8080"
    environment:
      - WEBGOAT_PORT=8080
    restart: unless-stopped

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: redlens-dvwa
    ports:
      - "8082:80"
    restart: unless-stopped

  vampi:
    image: erev0s/vampi:latest
    container_name: redlens-vampi
    ports:
      - "15000:5000"
    restart: unless-stopped