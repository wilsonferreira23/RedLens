name: RedLens CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --editable .
      - name: Compile
        run: python -m compileall -q redlens_config.py redlens_entrypoints.py engine adapters runtime
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compose validation
        run: docker compose -f runtime/compose.yaml config --quiet
      - name: Tool manifest
        run: python -m runtime.manifest --output /tmp/redlens-sbom.json
      - name: Runtime build and smoke
        run: |
          docker build --tag redlens-kali:ci runtime/kali-image
          docker run --rm redlens-kali:ci sh -lc '\
            for tool in whatweb wafw00f httpx-toolkit katana nuclei sslscan ffuf feroxbuster arjun nikto sqlmap commix dalfox tplmap schemathesis; do \
              command -v "$tool" >/dev/null || exit 1; \
            done'
